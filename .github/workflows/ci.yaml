name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # Code Quality Checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/package-lock.json

      - name: Install dependencies
        working-directory: apps
        run: npm ci

      - name: Run ESLint for Node.js (Backend)
        working-directory: apps
        run: |
          npx eslint server/**/*.js --ext .js --format json --output-file eslint-backend-report.json || true
          npx eslint server/**/*.js --ext .js --max-warnings 0 || true

      - name: Run ESLint for React (Frontend)
        working-directory: apps
        run: |
          npx eslint src/**/*.{js,jsx} --ext .js,.jsx --format json --output-file eslint-frontend-report.json || true
          npx eslint src/**/*.{js,jsx} --ext .js,.jsx --max-warnings 0 || true

      - name: Check code formatting (Prettier check)
        working-directory: apps
        run: |
          npx prettier --check "server/**/*.js" "src/**/*.{js,jsx}" || echo "Prettier not configured, skipping..."

      - name: Upload ESLint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-reports
          path: |
            apps/eslint-backend-report.json
            apps/eslint-frontend-report.json
          retention-days: 7

  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/package-lock.json

      - name: Install dependencies
        working-directory: apps
        run: npm ci

      - name: Run React unit tests
        working-directory: apps
        run: npm test -- --watchAll=false --coverage --coverageReporters=json --coverageReporters=text
        env:
          CI: true

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: apps/coverage
          retention-days: 7

  # Build and Push Backend Image
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}/${{ github.event.repository.name }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: apps
          file: apps/Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest (backend)
        run: |
          echo "Backend image built: ${{ steps.meta-backend.outputs.tags }}"

  # Build and Push Frontend Image
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}/${{ github.event.repository.name }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: apps
          file: apps/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest (frontend)
        run: |
          echo "Frontend image built: ${{ steps.meta-frontend.outputs.tags }}"

   # Test Backend Image
  test-backend-image:
    name: Test Backend Image
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull backend image
        run: |
          IMAGE_TAG=${GITHUB_REF#refs/heads/}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
          fi
          docker pull ${{ env.IMAGE_NAME }}/${{ github.event.repository.name }}-backend:${IMAGE_TAG} || \
          docker pull ${{ env.IMAGE_NAME }}/${{ github.event.repository.name }}-backend:latest

      - name: Run backend container health check
        run: |
          IMAGE_TAG=${GITHUB_REF#refs/heads/}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
          fi
          IMAGE=${{ env.IMAGE_NAME }}/${{ github.event.repository.name }}-backend:${IMAGE_TAG}
          docker pull ${IMAGE} || IMAGE=${{ env.IMAGE_NAME }}/${{ github.event.repository.name }}-backend:latest
          
          # Start container in background
          CONTAINER_ID=$(docker run -d \
            -e NODE_ENV=test \
            -e PORT=3099 \
            --health-cmd="node -e \"require('http').get('http://localhost:3099/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\"" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=3 \
            ${IMAGE})
          
          # Wait for health check
          echo "Waiting for backend container to be healthy..."
          timeout 60 bash -c 'until docker inspect --format="{{.State.Health.Status}}" $CONTAINER_ID | grep -q "healthy"; do sleep 2; done' || true
          
          # Check container status
          HEALTH_STATUS=$(docker inspect --format="{{.State.Health.Status}}" $CONTAINER_ID)
          echo "Backend container health status: ${HEALTH_STATUS}"
          
          # Run basic connectivity test
          docker exec $CONTAINER_ID node -e "console.log('Node.js version:', process.version)" || exit 1
          
          # Cleanup
          docker stop $CONTAINER_ID
          docker rm $CONTAINER_ID
          
          if [ "${HEALTH_STATUS}" != "healthy" ]; then
            echo "Backend container health check failed"
            exit 1
          fi

      - name: Test backend image structure
        run: |
          IMAGE_TAG=${GITHUB_REF#refs/heads/}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
          fi
          IMAGE=${{ env.IMAGE_NAME }}/${{ github.event.repository.name }}-backend:${IMAGE_TAG}
          docker pull ${IMAGE} || IMAGE=${{ env.IMAGE_NAME }}/${{ github.event.repository.name }}-backend:latest
          
          # Check image layers and size
          docker images ${IMAGE}
          
          # Verify non-root user exists
          docker run --rm ${IMAGE} id -u | grep -v "^0$" || (echo "Container should not run as root" && exit 1)
          
          # Verify required files exist
          docker run --rm ${IMAGE} test -f /app/server/server.js || (echo "server.js not found" && exit 1)
          docker run --rm ${IMAGE} test -d /app/server || (echo "server directory not found" && exit 1)

  # Test Frontend Image
  test-frontend-image:
    name: Test Frontend Image
    runs-on: ubuntu-latest
    needs: [build-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull frontend image
        run: |
          IMAGE_TAG=${GITHUB_REF#refs/heads/}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
          fi
          docker pull ${{ env.IMAGE_NAME }}/${{ github.event.repository.name }}-frontend:${IMAGE_TAG} || \
          docker pull ${{ env.IMAGE_NAME }}/${{ github.event.repository.name }}-frontend:latest

      - name: Run frontend container health check
        run: |
          IMAGE_TAG=${GITHUB_REF#refs/heads/}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
          fi
          IMAGE=${{ env.IMAGE_NAME }}/${{ github.event.repository.name }}-frontend:${IMAGE_TAG}
          docker pull ${IMAGE} || IMAGE=${{ env.IMAGE_NAME }}/${{ github.event.repository.name }}-frontend:latest
          
          # Start container in background
          CONTAINER_ID=$(docker run -d -p 8080:80 ${IMAGE})
          
          # Wait for nginx to start
          echo "Waiting for frontend container to start..."
          sleep 5
          
          # Test HTTP connectivity
          curl -f http://localhost:8080/ || (echo "Frontend not accessible" && exit 1)
          
          # Check if index.html is served
          curl -f http://localhost:8080/ | grep -q "<!DOCTYPE html>" || (echo "Invalid HTML response" && exit 1)
          
          # Cleanup
          docker stop $CONTAINER_ID
          docker rm $CONTAINER_ID

      - name: Test frontend image structure
        run: |
          IMAGE_TAG=${GITHUB_REF#refs/heads/}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
          fi
          IMAGE=${{ env.IMAGE_NAME }}/${{ github.event.repository.name }}-frontend:${IMAGE_TAG}
          docker pull ${IMAGE} || IMAGE=${{ env.IMAGE_NAME }}/${{ github.event.repository.name }}-frontend:latest
          
          # Check image layers and size
          docker images ${IMAGE}
          
          # Verify nginx is installed
          docker run --rm ${IMAGE} nginx -v || (echo "nginx not found" && exit 1)
          
          # Verify static files exist
          docker run --rm ${IMAGE} test -d /usr/share/nginx/html || (echo "nginx html directory not found" && exit 1)
          docker run --rm ${IMAGE} test -f /usr/share/nginx/html/index.html || (echo "index.html not found" && exit 1)

  